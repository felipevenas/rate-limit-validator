name: Gerar Executavel e Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar Ícones e Compilar Executável (.exe)
        run: |
          python scripts/gerar_icone_ico.py
          python scripts/build_executavel.py

      - name: Publicar Artefato do Executável
        uses: actions/upload-artifact@v4
        with:
          name: ValidadorRateLimit-Windows
          path: dist/ValidadorRateLimit.exe

      - name: Criar GitHub Release Automática
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ValidadorRateLimit.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
