<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Minimal Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="64" r="32" fill="#4f46e5" opacity="0.15" />

  <!-- Precision Minimal Threshold Ring (Rate Limit Boundary) -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#27272a" stroke-width="2.5" stroke-dasharray="4 4" />
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="28 90" stroke-linecap="round" />

  <!-- Geometric Minimal Traffic Waveform / Pulse -->
  <path d="M 32 64 L 46 64 L 54 44 L 64 84 L 74 48 L 82 64 L 96 64" 
        fill="none" 
        stroke="url(#indigoGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- High-Precision Center Node -->
  <circle cx="64" cy="84" r="2.5" fill="#ffffff" />
  <circle cx="54" cy="44" r="2.5" fill="#38bdf8" />
</svg>
